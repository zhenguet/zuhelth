name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Generate a lockfile on the first run. Once package-lock.json is committed,
      # npm install will honor it; this step artifact allows us to commit the exact file.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload generated npm lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: warn
          retention-days: 7
