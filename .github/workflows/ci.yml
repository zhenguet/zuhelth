name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest
    outputs:
      lockfile-synced: ${{ steps.lockfile.outputs.synced }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check whether package-lock matches package.json
        id: lockfile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          let lock;
          try {
            lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          } catch {
            lock = null;
          }

          const root = lock?.packages?.[""];
          const normalize = (value) =>
            JSON.stringify(
              Object.fromEntries(
                Object.entries(value ?? {}).sort(([a], [b]) => a.localeCompare(b)),
              ),
            );

          const fields = ["dependencies", "devDependencies", "optionalDependencies", "engines"];
          const synced = Boolean(
            root &&
              fields.every((field) => normalize(manifest[field]) === normalize(root[field])),
          );

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `synced=${synced}\n`);
          console.log(synced ? "Lockfile is synchronized." : "Lockfile needs updating.");
          NODE

      - name: Install dependencies from lockfile
        if: steps.lockfile.outputs.synced == 'true'
        run: npm ci --no-audit --no-fund

      - name: Install dependencies and refresh lockfile
        if: steps.lockfile.outputs.synced != 'true'
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  sync-lockfile:
    name: Commit updated lockfile
    needs: validate
    if: needs.validate.result == 'success' && needs.validate.outputs.lockfile-synced != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: npm-lockfile-${{ github.sha }}
          path: ./generated-lockfile

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          cp generated-lockfile/package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile update required."
            exit 0
          fi
          git commit -m "chore: sync npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
